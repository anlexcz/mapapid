name: Update PID GTFS
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
      timezone: "Europe/Prague"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download and build GTFS index
        run: python scripts/build_gtfs.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/gtfs-index.json data/routes
          git diff --cached --quiet || git commit -m "data: update PID GTFS"
          git push
