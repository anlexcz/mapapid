<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MapaPID – debug realtime</title><style>body{font:14px/1.45 monospace;margin:20px;max-width:1100px}pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f4;padding:16px;border-radius:8px}button,input{font:inherit;padding:8px}.err{color:#b00}</style></head><body><h1>MapaPID – realtime debug</h1><p>Živý výpis přes náš proxy Worker. Vybere zadané ev. číslo a dva další vozy stejné linky. API klíč není ve stránce.</p><p><input id="ev" value="9436"><button id="go">Načíst</button></p><div id="out">Načítám…</div><script>
const proxy="https://mapapid-api.trsek-jiri.workers.dev/";
const deep=(o,k)=>{if(!o||typeof o!=="object")return null;if(o[k]!=null)return o[k];for(const v of Object.values(o)){if(v&&typeof v==="object"){const r=deep(v,k);if(r!=null)return r}}return null};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function run(){const out=document.getElementById("out"),wanted=document.getElementById("ev").value.trim();out.textContent="Načítám…";try{const r=await fetch(proxy);if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json(),fs=j.features||j;const hit=fs.find(x=>String(deep(x.properties||x,"vehicle_registration_number"))===wanted);if(!hit){out.innerHTML='<p class="err">Vůz '+esc(wanted)+' teď v realtime datech není.</p>';return}const line=deep(hit.properties||hit,"route_short_name");const others=fs.filter(x=>x!==hit&&String(deep(x.properties||x,"route_short_name"))===String(line)).slice(0,2),selected=[hit,...others];out.innerHTML="<p><b>"+selected.length+" záznamy</b> · linka "+esc(line)+" · načteno "+new Date().toLocaleTimeString("cs-CZ")+"</p>"+selected.map((x,i)=>"<h2>"+(i?"Srovnávací spoj "+i:"Vůz "+esc(wanted))+"</h2><pre>"+esc(JSON.stringify(x,null,2))+"</pre>").join("")}catch(e){out.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
document.getElementById("go").onclick=run;run();
</script></body></html>
