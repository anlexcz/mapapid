<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff3600"><title>MapaPID</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="map"></div>
  <header><strong>MapaPID</strong><button id="locate" title="Moje poloha">◎</button></header>
  <button id="filterBtn" class="floating">Filtry <span id="count">0</span></button>
  <section id="sheet" class="sheet">
    <div class="grab"></div><div class="sheet-head"><b>Vozidla PID</b><button id="closeSheet">×</button></div>
    <input id="search" placeholder="Linka, pořadí nebo ev. číslo…" autocomplete="off">
    <div class="filters">
      <select id="operator"><option value="">Všichni dopravci</option></select>
      <select id="vehicleType"><option value="">Všechny typy vozů</option></select>
      <input id="line" placeholder="Linka">
      <input id="order" placeholder="Pořadí">
    </div>
    <div id="status" class="status">Načítám…</div><div id="list"></div>
  </section>
  <dialog id="detail"><button class="x" id="closeDetail">×</button><div id="detailBody"></div></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./config.js"></script><script src="./app.js"></script>
</body></html>
