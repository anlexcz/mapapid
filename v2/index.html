<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MapaPID v2 debug</title>
  <link id="leafletCss" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./debug.css">
</head>
<body>
  <div id="map"></div>
  <header class="topbar">
    <strong>MapaPID v2 · debug</strong>
    <span id="status">Načítám…</span>
    <button id="refresh" type="button">Obnovit</button>
  </header>
  <aside id="debugPanel" class="debug-panel" hidden>
    <div class="debug-head">
      <strong id="debugTitle">Vozidlo</strong>
      <button id="debugClose" type="button" aria-label="Zavřít">×</button>
    </div>
    <pre id="debugBody"></pre>
  </aside>
  <script>
    window.__loadLeafletFallback=function(){
      if(window.L)return;
      var css=document.getElementById('leafletCss');
      if(css)css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      var s=document.createElement('script');
      s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=window.__startMapaPidV2;
      s.onerror=function(){document.getElementById('status').textContent='Chyba: nepodařilo se načíst Leaflet';};
      document.head.appendChild(s);
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" onerror="window.__loadLeafletFallback()"></script>
  <script src="../config.js"></script>
  <script type="module">
    import('./debug-app.js').catch(error=>{
      console.error(error);
      document.getElementById('status').textContent='Chyba aplikace: '+error.message;
    });
  </script>
</body>
</html>
